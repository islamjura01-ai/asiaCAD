# AsiaCAD — Windows yig'ish: har push'da AsiaCAD-Windows.zip (Actions → Artifacts);
# "v*" tegi qo'yilsa — Releases sahifasiga ham yuklanadi.
name: Windows build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Qt 6 o'rnatish
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true

      - name: MSVC muhiti
        uses: ilammy/msvc-dev-cmd@v1

      - name: Konfiguratsiya
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Yig'ish
        run: cmake --build build --parallel

      - name: Testlar (yadro)
        continue-on-error: true
        run: build\asiacad_tests.exe

      - name: Tarqatma papkasi
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = "AsiaCAD"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item build\asiacad-gui.exe $d\AsiaCAD.exe
          Copy-Item build\asiacad.exe $d\asiacad-cli.exe
          Copy-Item -Recurse i18n $d\i18n
          if (Test-Path examples) { Copy-Item -Recurse examples $d\examples }
          windeployqt --release --no-translations --compiler-runtime $d\AsiaCAD.exe
          # DWG: LibreDWG (GPL-3, alohida dastur) — dwg2dxf/dxf2dwg dastur yonidagi libredwg\ papkasiga
          try {
            gh release download --repo LibreDWG/libredwg --pattern "*win64*.zip" --dir ldwg
            Expand-Archive (Get-ChildItem ldwg\*.zip | Select-Object -First 1).FullName -DestinationPath ldwg\x -Force
            $exe = Get-ChildItem -Recurse ldwg\x -Filter dwg2dxf.exe | Select-Object -First 1
            if ($exe) {
              New-Item -ItemType Directory -Force $d\libredwg | Out-Null
              Copy-Item "$($exe.DirectoryName)\*" $d\libredwg -Recurse
              Get-ChildItem -Recurse ldwg\x -Filter COPYING* | Select-Object -First 1 | Copy-Item -Destination $d\libredwg
            }
          } catch { Write-Host "LibreDWG yuklanmadi: $_" }
          "AsiaCAD — ishga tushirish: AsiaCAD.exe (buyruq satri: asiacad-cli.exe)" | Out-File -Encoding utf8 $d\README.txt
          Compress-Archive -Path $d -DestinationPath AsiaCAD-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AsiaCAD-Windows
          path: AsiaCAD-Windows.zip

      - name: Release (teg bo'lsa)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AsiaCAD-Windows.zip
